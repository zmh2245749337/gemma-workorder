[project]
name = "gemma-inference-eval"
version = "0.2.0"
description = "White-box Gemma 3 architecture reproduction, numerical alignment and efficient inference experiments."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.50.0,<6",
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "huggingface-hub>=0.27",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "psutil>=5.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
