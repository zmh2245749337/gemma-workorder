[project]
name = "gemma-tool-use"
version = "0.4.0"
description = "Context-aware tool-use post-training and guarded local execution for Gemma 3-1B."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.50.0,<6",
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "huggingface-hub>=0.27",
  "peft>=0.14",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
