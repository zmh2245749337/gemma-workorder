[project]
name = "gemma-workorder"
version = "0.3.0"
description = "Gemma 3-1B QLoRA work-order extraction with constrained local tools and white-box decoder validation."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.50.0,<6",
  "accelerate>=1.0",
  "bitsandbytes>=0.45",
  "huggingface-hub>=0.27",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "psutil>=5.9",
  "peft>=0.14",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
